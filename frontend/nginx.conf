# ---------------------------------------------------------------------------
# SpendIO frontend reverse proxy (ARCHITECTURE.md Phase 16).
#
# Rendered by the nginx image entrypoint (envsubst) from
# /etc/nginx/templates/default.conf.template. ${BACKEND_UPSTREAM} defaults to
# http://backend:8080 (the compose service) and can be overridden per deploy.
#
# Serves the built SPA, proxies /api and the approved /actuator health/info probes
# to the backend, and sets the security headers from ARCHITECTURE.md J.1.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 12m;   # CSV import cap (10 MB) plus multipart overhead

    # Strict CSP (ARCHITECTURE.md J.1): no inline script, style comes from the bundle.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API is proxied to the backend; the SPA never sees it.
    location /api/ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # C2: only the approved health/info probes are proxied publicly. Operational
    # endpoints (metrics, prometheus, ...) are never exposed through this edge; the
    # private Prometheus scrape talks to the backend directly over the Docker network.
    location ~ ^/actuator/(health(/.*)?|info)$ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Anything else under /actuator (metrics, prometheus, ...) is denied at the edge.
    location /actuator/ {
        return 404;
    }

    # Hashed assets are immutable. The security headers are repeated here because a
    # location-level add_header suppresses inheritance from the server block (M1).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        try_files $uri =404;
    }

    # SPA fallback — React Router owns the URL space.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
