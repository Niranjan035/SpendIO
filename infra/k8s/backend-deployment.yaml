# SpendIO backend Deployment + Service (ARCHITECTURE.md Phase 16).
# Secrets are supplied out-of-band; see secret.example.yaml for the required keys.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spendio-backend
  labels:
    app.kubernetes.io/name: spendio-backend
    app.kubernetes.io/part-of: spendio
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spendio-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spendio-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      containers:
        - name: backend
          image: ghcr.io/OWNER/spendio-backend:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: spendio-config
            - secretRef:
                name: spendio-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                # Give the load balancer time to drain before graceful shutdown.
                command: ["sh", "-c", "sleep 10"]
---
apiVersion: v1
kind: Service
metadata:
  name: spendio-backend
  labels:
    app.kubernetes.io/part-of: spendio
spec:
  selector:
    app.kubernetes.io/name: spendio-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
