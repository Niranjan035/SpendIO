# SpendIO secret template (ARCHITECTURE.md Phase 16).
# Copy, fill in real values, and apply with `kubectl apply -f`. Never commit a
# filled-in copy. Keys mirror the environment variables in .env.example.
#
#   kubectl create secret generic spendio-secrets \
#     --from-literal=SPENDIO_DB_URL='jdbc:mysql://...' \
#     --from-literal=SPENDIO_DB_USERNAME=spendio \
#     --from-literal=SPENDIO_DB_PASSWORD='...' \
#     --from-literal=SPENDIO_JWT_SECRET="$(openssl rand -base64 48)"
apiVersion: v1
kind: Secret
metadata:
  name: spendio-secrets
  labels:
    app.kubernetes.io/part-of: spendio
type: Opaque
stringData:
  SPENDIO_DB_URL: "jdbc:mysql://mysql:3306/spendio?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true"
  SPENDIO_DB_USERNAME: "spendio"
  SPENDIO_DB_PASSWORD: "change-me"
  SPENDIO_JWT_SECRET: "change-me-to-a-random-48-byte-base64-string-at-least-32-bytes"
  SPENDIO_MAIL_USERNAME: "change-me"
  SPENDIO_MAIL_PASSWORD: "change-me"
