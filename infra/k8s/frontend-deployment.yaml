# SpendIO frontend Deployment + Service (ARCHITECTURE.md Phase 16).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spendio-frontend
  labels:
    app.kubernetes.io/name: spendio-frontend
    app.kubernetes.io/part-of: spendio
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spendio-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spendio-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/OWNER/spendio-frontend:latest
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_UPSTREAM
              valueFrom:
                configMapKeyRef:
                  name: spendio-config
                  key: BACKEND_UPSTREAM
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: spendio-frontend
  labels:
    app.kubernetes.io/part-of: spendio
spec:
  selector:
    app.kubernetes.io/name: spendio-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
