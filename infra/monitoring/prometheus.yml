# ---------------------------------------------------------------------------
# SpendIO Prometheus scrape config (ARCHITECTURE.md Phase 15/16).
# Optional stack - bring up with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     -f docker-compose.monitoring.yml up -d
# ---------------------------------------------------------------------------
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: spendio

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: spendio-backend
    metrics_path: /actuator/prometheus
    # C2: operational endpoints are not public; scrape with the shared bearer token
    # materialised at container start (see docker-compose.monitoring.yml).
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/scrape-token
    static_configs:
      - targets: ["backend:8080"]
