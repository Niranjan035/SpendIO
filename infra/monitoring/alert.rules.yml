# ---------------------------------------------------------------------------
# SpendIO alerting rules (ARCHITECTURE.md Phase 15/16).
# Latency thresholds match the SLO buckets in application-prod.yml:
#   50ms,100ms,250ms,500ms,1s,2s.
# ---------------------------------------------------------------------------
groups:
  - name: spendio-availability
    rules:
      - alert: SpendioBackendDown
        expr: up{job="spendio-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "SpendIO backend is not responding to scrapes"
          runbook: "docs/RUNBOOK.md#incident-checklist"

      - alert: SpendioHealthNotUp
        expr: max by (instance) (spring_boot_actuator_health_status{status="UP"}) != 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Health indicator is not UP"
          runbook: "docs/RUNBOOK.md#incident-checklist"

  - name: spendio-latency
    rules:
      - alert: SpendioP95LatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket[5m]))) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 request latency above 500ms"
          runbook: "docs/RUNBOOK.md#performance-budgets"

      - alert: SpendioP95LatencyCritical
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket[5m]))) > 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "p95 request latency above the 2s budget"
          runbook: "docs/RUNBOOK.md#performance-budgets"

  - name: spendio-errors
    rules:
      - alert: Spendio5xxRateHigh
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 1) > 0.01
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Server error rate above 1% for 10m"
          runbook: "docs/RUNBOOK.md#incident-checklist"

  - name: spendio-data
    rules:
      - alert: SpendioDbPoolSaturated
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HikariCP pool above 90% utilisation"
          runbook: "docs/RUNBOOK.md#performance-budgets"

      - alert: SpendioJvmHeapHigh
        expr: |
          sum(jvm_memory_used_bytes{area="heap"})
            / sum(jvm_memory_max_bytes{area="heap"}) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "JVM heap above 90%"
          runbook: "docs/RUNBOOK.md#performance-budgets"
