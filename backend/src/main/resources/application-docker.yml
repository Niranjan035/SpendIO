spring:
  datasource:
    url: ${SPENDIO_DB_URL:jdbc:mysql://mysql:3306/spendio?createDatabaseIfNotExist=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPENDIO_DB_USERNAME:spendio}
    password: ${SPENDIO_DB_PASSWORD:spendio}

logging:
  level:
    root: INFO
    com.spendio: INFO

spendio:
  web:
    cors:
      allowed-origins: ${SPENDIO_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
  security:
    jwt:
      secret: ${SPENDIO_JWT_SECRET:local-development-only-secret-not-for-production-0123456789abcdef}
    cookie:
      secure: ${SPENDIO_COOKIE_SECURE:false}
  mail:
    enabled: true
