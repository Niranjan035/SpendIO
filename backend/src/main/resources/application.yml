spring:
  application:
    name: spendio
  # Authentication is a stateless JWT filter; the default in-memory user is never
  # reachable (form login / basic disabled) and only logs a random "generated
  # security password" at startup, so remove it.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  mail:
    host: ${SPENDIO_MAIL_HOST:localhost}
    port: ${SPENDIO_MAIL_PORT:1025}
    username: ${SPENDIO_MAIL_USERNAME:}
    password: ${SPENDIO_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  profiles:
    default: dev
  datasource:
    url: ${SPENDIO_DB_URL:jdbc:mysql://localhost:3306/spendio?createDatabaseIfNotExist=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPENDIO_DB_USERNAME:spendio}
    password: ${SPENDIO_DB_PASSWORD:spendio}
    hikari:
      pool-name: spendio-hikari
      maximum-pool-size: ${SPENDIO_DB_POOL_SIZE:10}
      minimum-idle: ${SPENDIO_DB_MIN_IDLE:2}
      connection-timeout: 5000
      validation-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # quotes identifiers that are SQL keywords (e.g. csv_import_rows.row_number,
        # reserved by MySQL 8) in generated SQL
        auto_quote_keyword: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  lifecycle:
    timeout-per-shutdown-phase: 20s
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    encoding:
      charset: UTF-8
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # SMTP reachability must not mark the app DOWN: mail is asynchronous and the
    # aggregate /actuator/health backs the container HEALTHCHECK.
    mail:
      enabled: false
  metrics:
    distribution:
      # p95/p99 latency for the per-endpoint SLOs (ARCHITECTURE.md Phase 15).
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2s

info:
  app:
    name: SpendIO
    description: Personal finance and expense tracker

spendio:
  metrics:
    # C2: shared bearer token Prometheus presents to scrape /actuator/prometheus.
    # Blank (default) keeps the endpoint authenticated; set SPENDIO_METRICS_SCRAPE_TOKEN
    # together with the monitoring overlay to enable the private scrape.
    scrape-token: ${SPENDIO_METRICS_SCRAPE_TOKEN:}
  web:
    cors:
      allowed-origins:
        - http://localhost:5173
        - http://127.0.0.1:5173
      allowed-methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowed-headers:
        - Authorization
        - Content-Type
        - Accept
        - X-XSRF-TOKEN
        - X-Request-Id
        - Idempotency-Key
      allow-credentials: true
      max-age: 3600
  security:
    jwt:
      # Dev default only - prod and docker profiles require SPENDIO_JWT_SECRET (>= 32 chars).
      secret: ${SPENDIO_JWT_SECRET:dev-only-spendio-jwt-secret-change-me-0123456789}
      kid: ${SPENDIO_JWT_KID:v1}
      access-token-ttl: 15m
      refresh-token-ttl: 720h
      remember-me-refresh-ttl: 2160h
      absolute-session-ttl: 2160h
    cookie:
      name: spendio_rt
      path: /api/v1/auth
      secure: false
    rate-limit:
      window: 5m
      sensitive-requests: 10
      auth-requests: 60
    password:
      # K.1 P0 breach-list check (HIBP k-anonymity); fails open when unreachable.
      breached-check-enabled: true
      min-length: 10
      max-length: 72
  mail:
    enabled: false
    from: SpendIO <no-reply@spendio.local>
    base-url: ${SPENDIO_WEB_BASE_URL:http://localhost:5173}
  transactions:
    # Reject business dates further ahead than this (ARCHITECTURE.md D.8: default +1 year).
    max-future-days: 365
  fx:
    # Reference-rate provider (ARCHITECTURE.md D.5): defaults to Frankfurter (ECB, keyless)
    # so multi-currency accounts work out of the box. Blank disables the HTTP client and
    # reduces the app to manual rates only. Override with SPENDIO_FX_PROVIDER_URL.
    provider-url: ${SPENDIO_FX_PROVIDER_URL:https://api.frankfurter.dev/v1}
