spring:
  application:
    name: spendio
  profiles:
    default: dev
  datasource:
    url: ${SPENDIO_DB_URL:jdbc:mysql://localhost:3306/spendio?createDatabaseIfNotExist=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPENDIO_DB_USERNAME:spendio}
    password: ${SPENDIO_DB_PASSWORD:spendio}
    hikari:
      pool-name: spendio-hikari
      maximum-pool-size: ${SPENDIO_DB_POOL_SIZE:10}
      minimum-idle: ${SPENDIO_DB_MIN_IDLE:2}
      connection-timeout: 5000
      validation-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  lifecycle:
    timeout-per-shutdown-phase: 20s
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    encoding:
      charset: UTF-8
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: SpendIO
    description: Personal finance and expense tracker

spendio:
  web:
    cors:
      allowed-origins:
        - http://localhost:5173
        - http://127.0.0.1:5173
      allowed-methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowed-headers:
        - Authorization
        - Content-Type
        - Accept
        - X-XSRF-TOKEN
        - X-Request-Id
      allow-credentials: true
      max-age: 3600
