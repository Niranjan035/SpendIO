logging:
  level:
    root: INFO
    com.spendio: DEBUG
    org.hibernate.SQL: DEBUG

management:
  endpoint:
    health:
      show-details: always

# Mailpit in dev (docker-compose): messages land in the Mailpit UI on :8025.
spendio:
  mail:
    enabled: true
    from: SpendIO <no-reply@spendio.local>
